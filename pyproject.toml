[project]
name = "manga-lora"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fire>=0.7.1",
    "openai>=3.19.0",
    "pydantic-settings>=2.15.0",
    "sacrebleu>=2.4",
]

[project.optional-dependencies]
finetune = ["accelerate>=1.0", "peft>=0.13", "torch>=2.4", "transformers>=4.56"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_lora"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "fire"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["peft.*", "torch.*", "transformers.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
